name: Deploy backend to Hugging Face

# Ships the backend to the private Space whenever code it runs changes on master. The bundle is an allowlist
# (scripts/deploy_space.py), so data/ and .env are never uploaded.
# Needs the repository secret HF_TOKEN (write access) and the repository variable HF_SPACE (<hf-user>/<space>).
on:
  push:
    branches: [master]
    paths:
      - "agents/**"
      - "backend/**"
      - "harness/**"
      - "loops/**"
      - "mcp_server/**"
      - "scripts/**"
      - "ui/controller.py"
      - "requirements.txt"
      - "requirements-api.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the secret and variable are set (names only)
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::repository secret HF_TOKEN is not set"; exit 1; }
          [ -n "$HF_SPACE" ] || { echo "::error::repository variable HF_SPACE is not set"; exit 1; }
      - name: Install the uploader
        run: python -m pip install huggingface_hub==2.3.0
      - name: Build and upload
        run: python -m scripts.deploy_space --space "$HF_SPACE"
