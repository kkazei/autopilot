name: CI

# Every push and pull request runs the whole offline suite on the target Python. The tests need no secrets and no
# network (conftest.py blocks non-loopback sockets), so a failure here is always a real failure.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-api.txt
      - name: Run pytest
        run: python -m pytest -q
