name: Autopilot run

# The schedule only measures: it reads engagement on posts that are old enough, saves a learning for each, and makes
# no drafts. Publishing needs a human to answer the approval prompt, which happens in the web app (docs/WEB_APP_PLAN.md).
# A manual run with dry_run = true does the whole loop without publishing anything.
#
# State lives in Postgres (DATABASE_URL): scripts.db_run pulls it, runs, and pushes it back under the same lock the
# web backend takes, so the two never overlap. Nothing is committed to the repository any more.
#
# Scheduled workflows run from the default branch only: this file does nothing on a schedule until it is merged there.
# 06:17 UTC is an assumption (off the hour, when scheduled jobs queue); a post made the evening before is over 2 hours old.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: plan, write and critique, then publish to dryrun:// (spends model requests, saves no plan or learning). false: measure only."
        type: boolean
        default: false

permissions:
  contents: read

# Queued rather than overlapped; the database lock also stops a cron run that starts while the web backend is busy.
concurrency:
  group: autopilot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are set (names only, never values)
        run: |
          missing=0
          for name in OPENROUTER_API_KEY OPENROUTER_MODELS BLUESKY_HANDLE BLUESKY_APP_PASSWORD DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # The runner uses the direct OpenRouter path (AUTOPILOT_WRITER_RUNTIME is unset, so "direct"); Hermes is not installed here.
      # scripts.db_run passes its arguments to scripts.run_outer unchanged.
      - name: Run the outer loop
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m scripts.db_run --dry-run --no-approve
          else
            python -m scripts.db_run --measure-only
          fi
