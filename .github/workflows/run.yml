name: Autopilot run

# The schedule only measures: it reads engagement on posts that are old enough, saves a learning for each, and makes
# no drafts. Publishing needs a human to answer the approval prompt, and a runner has no keyboard, so live posts
# stay local (docs/DEPLOY.md). A manual run with dry_run = true does the whole loop without publishing anything.
#
# Scheduled workflows run from the default branch only: this file does nothing on a schedule until it is merged there.
# 06:17 UTC is an assumption (off the hour, when scheduled jobs queue); a post made the evening before is over 2 hours old.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: plan, write and critique, then publish to dryrun:// (spends model requests, saves no plan or learning). false: measure only."
        type: boolean
        default: false

permissions:
  contents: write

# Two runs must never overlap: the second would read data/ before the first has pushed it.
concurrency:
  group: autopilot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are set (names only, never values)
        run: |
          missing=0
          for name in OPENROUTER_API_KEY OPENROUTER_MODELS BLUESKY_HANDLE BLUESKY_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # The runner uses the direct OpenRouter path (AUTOPILOT_WRITER_RUNTIME is unset, so "direct"); Hermes is not installed here.
      # The entry point is scripts/run_outer.py; the plan's `python -m loops.outer` has no __main__ here.
      - name: Run the outer loop
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m scripts.run_outer --dry-run --no-approve
          else
            python -m scripts.run_outer --measure-only
          fi

      # Runs even when the loop failed, so a failed run still leaves its trace in the repo as evidence.
      - name: Commit and push new files under data/
        if: always()
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new under data/"
          else
            git commit -m "data: scheduled run ${GITHUB_RUN_ID}"
            git pull --rebase
            git push
          fi
